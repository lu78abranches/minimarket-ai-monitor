spring.application.name=backend-api
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8082}
# Configuração do MySQL
#spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/minimarket_db?createDatabaseIfNotExist=true}
#spring.datasource.username=${DB_USERNAME}
#spring.datasource.password=${DB_PASSWORD}
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.minimarket.backend_api=INFO
logging.level.org.springframework.web=DEBUG

# Configuração que lê as variáveis nativas de ambiente (PostgreSQL no Render)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Define o dialeto explicitamente para evitar erros de inicialização sem metadados
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ============================================
# Neon-Specific Connection Pool Configuration
# ============================================
# HikariCP settings optimized for Neon serverless
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.auto-commit=true

# PostgreSQL connection settings for Neon
spring.datasource.properties.ssl=true
spring.datasource.properties.sslmode=require
spring.datasource.properties.socketTimeout=30

# JPA/Hibernate settings for data persistence
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.flush_before_completion=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Transaction settings - CRITICAL FOR NEON
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.use_reflection_optimizer=true

# Explicit transaction configuration
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.orm.jpa=DEBUG



