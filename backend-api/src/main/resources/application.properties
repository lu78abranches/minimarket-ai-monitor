spring.application.name=backend-api
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8082}
# Configuração do MySQL
#spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/minimarket_db?createDatabaseIfNotExist=true}
#spring.datasource.username=${DB_USERNAME}
#spring.datasource.password=${DB_PASSWORD}
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Configuração que lê as variáveis nativas de ambiente (PostgreSQL no Render)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Define o dialeto explicitamente para evitar erros de inicialização sem metadados
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true



